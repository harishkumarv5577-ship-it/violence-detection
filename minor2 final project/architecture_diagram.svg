<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.55" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Proposed System Architecture</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Real-Time Violence Detection in Video</text>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="70" y="150" width="190" height="72" rx="12" fill="url(#primary)" filter="url(#shadow)"/>
    <text x="165" y="193" fill="#ffffff">User Login</text>

    <rect x="330" y="150" width="190" height="72" rx="12" fill="#ffffff" stroke="#14b8a6" stroke-width="3" filter="url(#shadow)"/>
    <text x="425" y="193" fill="#0f172a">Dashboard</text>

    <rect x="590" y="118" width="190" height="72" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
    <text x="685" y="161" fill="#0f172a">Upload Video</text>

    <rect x="590" y="220" width="190" height="72" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
    <text x="685" y="263" fill="#0f172a">Webcam Preview</text>

    <rect x="850" y="118" width="230" height="72" rx="12" fill="#ffffff" stroke="#14b8a6" stroke-width="3" filter="url(#shadow)"/>
    <text x="965" y="161" fill="#0f172a">OpenCV Processing</text>

    <rect x="850" y="238" width="230" height="72" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
    <text x="965" y="267" fill="#0f172a">MobileNetV3 + GRU</text>
    <text x="965" y="291" fill="#0f172a" font-size="15">Detection</text>

    <rect x="850" y="372" width="230" height="72" rx="12" fill="url(#alert)" filter="url(#shadow)"/>
    <text x="965" y="415" fill="#17212f">Output Page</text>

    <rect x="590" y="372" width="190" height="72" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
    <text x="685" y="401" fill="#0f172a">Alert Popup</text>
    <text x="685" y="425" fill="#0f172a" font-size="15">and Sound</text>

    <rect x="330" y="500" width="190" height="72" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
    <text x="425" y="543" fill="#0f172a">H2 Database</text>

    <rect x="70" y="500" width="190" height="72" rx="12" fill="#111827" filter="url(#shadow)"/>
    <text x="165" y="543" fill="#ffffff">Admin Login</text>

    <rect x="70" y="620" width="190" height="72" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
    <text x="165" y="649" fill="#0f172a">Admin</text>
    <text x="165" y="673" fill="#0f172a" font-size="15">Dashboard</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 186 H330"/>
    <path d="M520 186 C555 186 555 154 590 154"/>
    <path d="M520 186 C555 186 555 256 590 256"/>
    <path d="M780 154 H850"/>
    <path d="M965 190 V238"/>
    <path d="M965 310 V372"/>
    <path d="M850 408 H780"/>
    <path d="M850 408 C720 480 610 536 520 536"/>
    <path d="M590 408 H520"/>
    <path d="M165 572 V620"/>
    <path d="M260 656 C300 656 300 536 330 536"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#475569">
    <text x="600" y="696" text-anchor="middle">Login → Dashboard → Upload Video → Processing → Detection → Output / Alert → H2 Storage</text>
  </g>
</svg>
