<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061826"/>
      <stop offset="1" stop-color="#12355b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:58px;font-weight:800;fill:#ffffff}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:27px;fill:#dbeafe}
      .boxText{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:800;fill:#0f172a}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:800;fill:#ffffff}
      .note{font-family:Arial,Helvetica,sans-serif;font-size:25px;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <circle cx="120" cy="130" r="90" fill="#00b4d8" opacity="0.16"/>
  <circle cx="1280" cy="670" r="125" fill="#90e0ef" opacity="0.12"/>
  <text x="700" y="80" text-anchor="middle" class="title">Integration Testing</text>
  <text x="700" y="124" text-anchor="middle" class="sub">Testing the connection between website modules, model prediction, alert system, and database</text>

  <g transform="translate(90 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="92" rx="16" fill="#dbeafe"/>
    <text x="90" y="57" text-anchor="middle" class="boxText">Login</text>
    <path d="M195 46 H275" stroke="#90e0ef" stroke-width="9" stroke-linecap="round"/>
    <polygon points="275,46 252,31 252,61" fill="#90e0ef"/>
    <rect x="292" y="0" width="210" height="92" rx="16" fill="#ccfbf1"/>
    <text x="397" y="57" text-anchor="middle" class="boxText">Dashboard</text>
    <path d="M517 46 H597" stroke="#90e0ef" stroke-width="9" stroke-linecap="round"/>
    <polygon points="597,46 574,31 574,61" fill="#90e0ef"/>
    <rect x="614" y="0" width="200" height="92" rx="16" fill="#e0f2fe"/>
    <text x="714" y="57" text-anchor="middle" class="boxText">Video Upload</text>
    <path d="M829 46 H909" stroke="#90e0ef" stroke-width="9" stroke-linecap="round"/>
    <polygon points="909,46 886,31 886,61" fill="#90e0ef"/>
    <rect x="926" y="0" width="200" height="92" rx="16" fill="#fef3c7"/>
    <text x="1026" y="57" text-anchor="middle" class="boxText">OpenCV</text>
    <path d="M1141 46 H1221" stroke="#90e0ef" stroke-width="9" stroke-linecap="round"/>
    <polygon points="1221,46 1198,31 1198,61" fill="#90e0ef"/>
    <rect x="1238" y="0" width="180" height="92" rx="16" fill="#ede9fe"/>
    <text x="1328" y="57" text-anchor="middle" class="boxText">Model</text>
  </g>

  <g transform="translate(210 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="92" rx="16" fill="#dcfce7"/>
    <text x="125" y="57" text-anchor="middle" class="boxText">Output Page</text>
    <path d="M270 46 H355" stroke="#90e0ef" stroke-width="9" stroke-linecap="round"/>
    <polygon points="355,46 332,31 332,61" fill="#90e0ef"/>
    <rect x="375" y="0" width="230" height="92" rx="16" fill="#fee2e2"/>
    <text x="490" y="57" text-anchor="middle" class="boxText">Alert Popup</text>
    <path d="M625 46 H710" stroke="#90e0ef" stroke-width="9" stroke-linecap="round"/>
    <polygon points="710,46 687,31 687,61" fill="#90e0ef"/>
    <rect x="730" y="0" width="220" height="92" rx="16" fill="#dcfce7"/>
    <text x="840" y="57" text-anchor="middle" class="boxText">H2 Database</text>
  </g>

  <rect x="120" y="620" width="1160" height="95" rx="24" fill="#020617" opacity="0.78" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="660" class="label">Integration Test Result:</text>
  <text x="160" y="700" class="note">All modules communicate properly from user login to video upload, prediction, output display, alert generation, and result storage.</text>
</svg>
