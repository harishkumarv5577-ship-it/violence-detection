<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#12263a"/>
      <stop offset="1" stop-color="#26143d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:56px;font-weight:800;fill:#ffffff}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:27px;fill:#cbd5e1}
      .head{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#ffffff}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#dbeafe}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}
      .dark{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#111827}
      .axis{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#cbd5e1}
      .code{font-family:Consolas,monospace;font-size:22px;font-weight:700;fill:#bbf7d0}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="145" cy="135" r="100" fill="#38bdf8" opacity="0.13"/>
  <circle cx="1440" cy="760" r="135" fill="#f97316" opacity="0.13"/>
  <circle cx="1280" cy="145" r="95" fill="#a855f7" opacity="0.12"/>

  <text x="800" y="78" text-anchor="middle" class="title">Model Training Visualization</text>
  <text x="800" y="121" text-anchor="middle" class="sub">Violence and non-violence videos are processed, trained, evaluated, and saved as the final checkpoint</text>

  <rect x="80" y="180" width="680" height="610" rx="26" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="840" y="180" width="680" height="610" rx="26" fill="url(#panel)" filter="url(#shadow)"/>

  <text x="420" y="238" text-anchor="middle" class="head">Training Process Photo View</text>
  <text x="1180" y="238" text-anchor="middle" class="head">Training Accuracy and Loss Graph</text>

  <g transform="translate(145 295)">
    <rect x="0" y="0" width="550" height="330" rx="24" fill="#020617" stroke="#334155" stroke-width="4"/>
    <rect x="38" y="35" width="474" height="245" rx="18" fill="url(#screen)"/>
    <rect x="72" y="65" width="190" height="150" rx="12" fill="#0f172a" opacity="0.88"/>
    <rect x="88" y="82" width="72" height="50" rx="7" fill="#fee2e2"/>
    <rect x="174" y="82" width="72" height="50" rx="7" fill="#dcfce7"/>
    <rect x="88" y="148" width="72" height="50" rx="7" fill="#fef3c7"/>
    <rect x="174" y="148" width="72" height="50" rx="7" fill="#e0f2fe"/>
    <text x="167" y="242" text-anchor="middle" class="small">Video Frames</text>

    <rect x="298" y="65" width="178" height="150" rx="12" fill="#111827" opacity="0.9"/>
    <circle cx="350" cy="112" r="17" fill="#38bdf8"/>
    <circle cx="423" cy="92" r="17" fill="#ffffff"/>
    <circle cx="424" cy="154" r="17" fill="#a7f3d0"/>
    <circle cx="350" cy="174" r="17" fill="#facc15"/>
    <line x1="367" y1="108" x2="406" y2="96" stroke="#ffffff" stroke-width="5"/>
    <line x1="367" y1="116" x2="409" y2="151" stroke="#ffffff" stroke-width="5"/>
    <line x1="351" y1="129" x2="350" y2="157" stroke="#ffffff" stroke-width="5"/>
    <text x="387" y="242" text-anchor="middle" class="small">MobileNetV3 + GRU</text>

    <rect x="110" y="286" width="330" height="62" rx="31" fill="#111827"/>
    <text x="275" y="326" text-anchor="middle" class="code">Training Epoch 08 / 10</text>

    <rect x="60" y="365" width="132" height="56" rx="28" fill="#0284c7"/>
    <text x="126" y="401" text-anchor="middle" class="small">Dataset</text>
    <rect x="210" y="365" width="132" height="56" rx="28" fill="#16a34a"/>
    <text x="276" y="401" text-anchor="middle" class="small">Training</text>
    <rect x="360" y="365" width="132" height="56" rx="28" fill="#dc2626"/>
    <text x="426" y="401" text-anchor="middle" class="small">Prediction</text>
  </g>

  <g transform="translate(905 300)">
    <rect x="0" y="0" width="545" height="380" rx="18" fill="#020617" stroke="#475569" stroke-width="3"/>
    <line x1="70" y1="315" x2="500" y2="315" stroke="#94a3b8" stroke-width="3"/>
    <line x1="70" y1="55" x2="70" y2="315" stroke="#94a3b8" stroke-width="3"/>
    <g stroke="#1e293b" stroke-width="2">
      <line x1="70" y1="263" x2="500" y2="263"/>
      <line x1="70" y1="211" x2="500" y2="211"/>
      <line x1="70" y1="159" x2="500" y2="159"/>
      <line x1="70" y1="107" x2="500" y2="107"/>
      <line x1="156" y1="55" x2="156" y2="315"/>
      <line x1="242" y1="55" x2="242" y2="315"/>
      <line x1="328" y1="55" x2="328" y2="315"/>
      <line x1="414" y1="55" x2="414" y2="315"/>
    </g>

    <polyline points="70,276 113,250 156,224 199,197 242,171 285,146 328,126 371,108 414,92 457,77 500,65" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="70,92 113,116 156,143 199,165 242,187 285,210 328,229 371,247 414,262 457,276 500,289" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="70" cy="276" r="7" fill="#22c55e"/>
    <circle cx="242" cy="171" r="7" fill="#22c55e"/>
    <circle cx="500" cy="65" r="7" fill="#22c55e"/>
    <circle cx="70" cy="92" r="7" fill="#f97316"/>
    <circle cx="242" cy="187" r="7" fill="#f97316"/>
    <circle cx="500" cy="289" r="7" fill="#f97316"/>

    <text x="54" y="321" text-anchor="end" class="axis">0</text>
    <text x="54" y="268" text-anchor="end" class="axis">20</text>
    <text x="54" y="216" text-anchor="end" class="axis">40</text>
    <text x="54" y="164" text-anchor="end" class="axis">60</text>
    <text x="54" y="112" text-anchor="end" class="axis">80</text>
    <text x="54" y="60" text-anchor="end" class="axis">100</text>

    <text x="70" y="348" text-anchor="middle" class="axis">1</text>
    <text x="156" y="348" text-anchor="middle" class="axis">3</text>
    <text x="242" y="348" text-anchor="middle" class="axis">5</text>
    <text x="328" y="348" text-anchor="middle" class="axis">7</text>
    <text x="414" y="348" text-anchor="middle" class="axis">9</text>
    <text x="500" y="348" text-anchor="middle" class="axis">10</text>
    <text x="285" y="374" text-anchor="middle" class="axis">Epochs</text>

    <rect x="295" y="73" width="170" height="74" rx="12" fill="#0f172a" opacity="0.86" stroke="#334155"/>
    <line x1="315" y1="98" x2="355" y2="98" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
    <text x="368" y="105" class="axis">Accuracy</text>
    <line x1="315" y1="125" x2="355" y2="125" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <text x="368" y="132" class="axis">Loss</text>
  </g>

  <g transform="translate(890 715)">
    <rect x="0" y="0" width="270" height="60" rx="30" fill="#16a34a"/>
    <text x="135" y="38" text-anchor="middle" class="small">Accuracy Improves</text>
    <rect x="295" y="0" width="230" height="60" rx="30" fill="#f97316"/>
    <text x="410" y="38" text-anchor="middle" class="small">Loss Reduces</text>
    <rect x="550" y="0" width="250" height="60" rx="30" fill="#7c3aed"/>
    <text x="675" y="38" text-anchor="middle" class="small">best.pt Saved</text>
  </g>

  <rect x="210" y="820" width="1180" height="45" rx="22" fill="#020617" opacity="0.78" stroke="#334155"/>
  <text x="800" y="850" text-anchor="middle" class="label">Training output is used by the website to classify uploaded videos as Violence Detected or No Violence Detected.</text>
</svg>
