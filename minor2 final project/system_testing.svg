<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1025"/>
      <stop offset="0.52" stop-color="#3b1d32"/>
      <stop offset="1" stop-color="#4a1f0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff595e"/>
      <stop offset="1" stop-color="#ffca3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:58px;font-weight:800;fill:#ffffff}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:27px;fill:#fed7aa}
      .head{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:800;fill:#ffffff}
      .boxText{font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:800;fill:#111827}
      .note{font-family:Arial,Helvetica,sans-serif;font-size:25px;fill:#fde68a}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:23px;fill:#f8fafc}
    </style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <circle cx="135" cy="135" r="100" fill="#ffca3a" opacity="0.13"/>
  <circle cx="1260" cy="660" r="130" fill="#ff595e" opacity="0.15"/>
  <text x="700" y="80" text-anchor="middle" class="title">System Testing</text>
  <text x="700" y="124" text-anchor="middle" class="sub">Testing the complete violence detection website as one working system</text>

  <g transform="translate(145 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="1110" height="360" rx="28" fill="#0f172a" opacity="0.93"/>
    <rect x="0" y="0" width="1110" height="78" rx="28" fill="url(#accent)"/>
    <text x="555" y="51" text-anchor="middle" class="head">Complete User Workflow</text>
    <rect x="72" y="130" width="190" height="86" rx="16" fill="#dbeafe"/>
    <text x="167" y="183" text-anchor="middle" class="boxText">Sign Up</text>
    <path d="M282 173 H356" stroke="#ffca3a" stroke-width="9" stroke-linecap="round"/>
    <polygon points="356,173 333,158 333,188" fill="#ffca3a"/>
    <rect x="380" y="130" width="190" height="86" rx="16" fill="#ccfbf1"/>
    <text x="475" y="183" text-anchor="middle" class="boxText">Login</text>
    <path d="M590 173 H664" stroke="#ffca3a" stroke-width="9" stroke-linecap="round"/>
    <polygon points="664,173 641,158 641,188" fill="#ffca3a"/>
    <rect x="688" y="130" width="190" height="86" rx="16" fill="#fef3c7"/>
    <text x="783" y="183" text-anchor="middle" class="boxText">Upload</text>
    <path d="M898 173 H972" stroke="#ffca3a" stroke-width="9" stroke-linecap="round"/>
    <polygon points="972,173 949,158 949,188" fill="#ffca3a"/>
    <rect x="996" y="130" width="190" height="86" rx="16" fill="#fee2e2"/>
    <text x="1091" y="183" text-anchor="middle" class="boxText">Result</text>
    <text x="88" y="285" class="small">Tested full flow: user account, dashboard, video analysis, output page, alert sound, popup alert, admin page, and database result storage.</text>
  </g>

  <g transform="translate(145 615)">
    <rect x="0" y="0" width="330" height="80" rx="40" fill="#dc2626"/>
    <text x="165" y="50" text-anchor="middle" class="head">Violence Alert</text>
    <rect x="390" y="0" width="330" height="80" rx="40" fill="#16a34a"/>
    <text x="555" y="50" text-anchor="middle" class="head">Normal Output</text>
    <rect x="780" y="0" width="330" height="80" rx="40" fill="#2563eb"/>
    <text x="945" y="50" text-anchor="middle" class="head">Admin View</text>
  </g>

  <text x="700" y="750" text-anchor="middle" class="note">System Test Result: The complete project works from login to final output and stores the detection history successfully.</text>
</svg>
